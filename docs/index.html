<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PASU.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud" style="display:none;">
      <div id="status">接続中...</div>
      <div class="hud-row">
        <div class="hud-item">HP: <span id="hp">100</span></div>
        <div class="hud-item">💰 <span id="coins">0</span></div>
        <div class="hud-item" id="zone">BATTLE</div>
      </div>
    </div>
    
    <div id="mapSelect" style="display:none;">
      <h2>スポーン地点を選択</h2>
      <div id="mapList"></div>
    </div>
    
    <div id="mobileControls" style="display:none;">
      <div id="joystickArea">
        <div id="joystickStick"></div>
      </div>
      <div id="actionButtons">
        <button id="btnHook" class="action-btn" title="押している間フック">フック<br><small>S</small></button>
        <button id="btnHand" class="action-btn" title="ギミック・箱をつかむ">ハンド<br><small>W</small></button>
        <button id="btnAttack" class="action-btn">ATK</button>
        <button id="btnRest" class="action-btn">H</button>
      </div>
    </div>
    
    <div id="devToggle" onclick="UI.toggleDevMode()">⚙️</div>
  </div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="constants.js"></script>
  <script src="input.js"></script>
  <script src="particles.js"></script>
  <script src="renderer.js"></script>
  <script src="ui.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
